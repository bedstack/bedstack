# Run tests (e.g. build, typecheck) on pull requests

name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: ["1.3.2", "latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.bun }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.bun }}-bun-
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build

  test-typesafety:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: ["1.3.2", "latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.bun }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.bun }}-bun-
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies
        run: bun install
      - name: Generate types
        run: bun run typegen
      - name: Run typesafety tests
        run: bun run typecheck
